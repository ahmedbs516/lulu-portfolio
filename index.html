<style>
:root{
  --bg:#07040f;--bg2:#0d0820;--card:#151028;--card2:#1b1434;
  --purple:#7c3aed;--purple-deep:#5b21b6;--gold:#f0c85a;--gold-soft:#d4a84b;
  --green:#34d399;--red:#f87171;--text:#f5f0ff;--muted:#9d94b8;--border:rgba(124,58,237,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:
  radial-gradient(900px 500px at 0% -10%,rgba(124,58,237,0.25),transparent 60%),
  radial-gradient(700px 500px at 100% 0%,rgba(240,200,90,0.08),transparent 55%),
  linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--text);min-height:100vh;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px;position:relative}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,58,237,0.4)}
.logo svg{width:20px;height:20px}
.brand h1{font-size:17px;font-weight:800}
.brand span{font-size:11px;color:var(--muted);display:block;font-weight:400}
.pill{font-size:10px;color:var(--green);background:rgba(52,211,153,0.12);padding:4px 10px;border-radius:999px;font-weight:700}

.hero{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:8px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 80% -20%,rgba(124,58,237,0.35),transparent 60%);pointer-events:none}
.hero .label{font-size:12px;color:var(--muted)}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin:6px 0 2px;position:relative}
.hero .big .cur{font-size:15px;color:var(--gold);font-weight:600}
.hero .delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.up{color:var(--green);background:rgba(52,211,153,0.12)}
.down{color:var(--red);background:rgba(248,113,113,0.12)}
.hero .sub{font-size:11px;color:var(--muted);margin-top:8px;position:relative}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.stat .k{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat .v{font-size:17px;font-weight:800;margin-top:4px}
.stat .s{font-size:10.5px;color:var(--muted);margin-top:2px}

.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sect h2{font-size:15px;font-weight:700}

.alloc{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.alloc-inner{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:140px;height:140px;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .center .n{font-size:22px;font-weight:800}
.donut .center .t{font-size:10px;color:var(--muted)}
.legend{flex:1;display:flex;flex-direction:column;gap:7px}
.leg{display:flex;align-items:center;gap:8px;font-size:11.5px}
.leg .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg .nm{flex:1}
.leg .pc{color:var(--muted);font-size:10.5px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:2px}
.tab{flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s}
.tab.active{background:linear-gradient(135deg,var(--purple),var(--purple-deep));color:#fff;border-color:transparent}

.holding{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.asset-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.asset-info{flex:1;min-width:0}
.asset-info .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-info .cat{font-size:10.5px;color:var(--muted)}
.asset-num{text-align:left;flex-shrink:0}
.asset-num .v{font-size:13.5px;font-weight:700}
.asset-num .c{font-size:10.5px;font-weight:700}
.asset-num .p{font-size:10px;color:var(--muted)}

.cal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px}
.cal-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cal-row:last-child{border-bottom:none}
.cal-date{width:44px;height:40px;border-radius:11px;background:rgba(240,200,90,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.cal-date .d{font-size:13px;font-weight:800;color:var(--gold);line-height:1}
.cal-date .m{font-size:8px;color:var(--gold-soft)}
.cal-info{flex:1;min-width:0}
.cal-info .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-info .sub{font-size:10px;color:var(--muted)}
.cal-amt{font-size:12px;font-weight:700;color:var(--green)}

footer{text-align:center;padding:24px 0 8px;color:rgba(255,255,255,0.25);font-size:11px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CCOLORS = {
  'أشباه الموصلات':'#60a5fa',
  'حوسبة/AI':'#818cf8',
  'تعدين بيتكوين':'#fb923c',
  'معادن':'#e5e7eb',
  'عقارات/دخل':'#34d399',
  'طاقة':'#fbbf24',
  'تكنولوجيا عامة':'#a78bfa',
  'رافعة مالية':'#f472b6',
  'صناديق ETF':'#f0c85a',
  'أسهم أخرى':'#7c3aed'
};

function fmtEUR(v){ return '€' + Number(v).toLocaleString('en-US',{maximumFractionDigits:0}); }
function sign(v){ return (v>=0?'+':'') + Number(v).toLocaleString('en-US',{maximumFractionDigits:0}); }

// Hero
const tv = DATA.total_value_eur, tp = DATA.total_pnl_eur, tpp = DATA.total_pnl_pct;
document.getElementById('totalValue').innerHTML = fmtEUR(tv) + ' <span class="cur">EUR</span>';
document.getElementById('totalDelta').innerHTML =
  `<span class="delta ${tp>=0?'up':'down'}">${tp>=0?'▲':'▼'} ${sign(tp)}€ (${sign(tpp)}%)</span>`;
document.getElementById('heroSub').textContent =
  'التكلفة: €' + DATA.total_cost + ' · '+DATA.n_live+'/'+DATA.n_assets+' أصل بسعر حي · تحديث: اليوم';

// Stats
const stats = [
  {k:'💎 أرباح محصّلة', v:'€'+DATA.total_div.toFixed(2), s:'من التوزيعات', c:'var(--green)'},
  {k:'⚖️ عدد الأصول', v:DATA.n_assets, s:DATA.n_live+' بسعر حي', c:'var(--text)'},
  {k:'💰 إجمالي الإيداع', v:'€'+DATA.deposits, s:'عبر 45 عملية', c:'var(--gold)'},
  {k:'🏦 مسحوبات', v:'€'+Math.abs(DATA.withdrawals).toFixed(2), s:'منذ التأسيس', c:'var(--red)'},
];
document.getElementById('statsRow').innerHTML = stats.map(s=>
  `<div class="stat"><div class="k">${s.k}</div><div class="v" style="color:${s.c}">${s.v}</div><div class="s">${s.s}</div></div>`
).join('');

// Donut (by live value)
const cats = Object.entries(DATA.categories).sort((a,b)=>b[1].cost-a[1].cost);
const totalC = cats.reduce((s,c)=>s+c[1].cost,0) || 1;
const R = 42, C = 2*Math.PI*R;
let offset = 0;
let segs = cats.map(([name,v])=>{
  const dash = (v.cost/totalC)*C;
  const seg = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${CCOLORS[name]||'#888'}" stroke-width="12" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}"/>`;
  offset += dash; return seg;
}).join('');
document.getElementById('donut').innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="#241b3e" stroke-width="12"/>${segs}</svg><div class="center"><div class="n">${DATA.n_assets}</div><div class="t">أصل</div></div>`;
document.getElementById('legend').innerHTML = cats.map(([name,v])=>
  `<div class="leg"><span class="dot" style="background:${CCOLORS[name]||'#888'}"></span><span class="nm">${name}</span><span class="pc">${(v.cost/totalC*100).toFixed(1)}%</span></div>`
).join('');

// Tabs
const catsList = ['الكل', 'الأسهم', ...cats.map(c=>c[0])];
document.getElementById('tabs').innerHTML = catsList.map((c,i)=>

// Holdings
function renderHolds(filter){
  let list;
  if (filter==='الكل') list = DATA.holdings;
  else if (filter==='الأسهم') list = DATA.holdings.filter(h => h.cat!=='صناديق ETF' && h.cat!=='رافعة مالية');
  else list = DATA.holdings.filter(h=>h.cat===filter);
  const el = document.getElementById('holdings');
  if(!list.length){ el.innerHTML = '<div class="empty">لا توجد أصول في هذه الفئة</div>'; return; }
  el.innerHTML = list.map(h=>{
    const col = CCOLORS[h.cat]||'#888';
    const letter = (h.name||h.ticker).charAt(0);
    const live = h.live_price;
    const pnl = h.pnl_pct;
    let priceHtml, pnlHtml;
    if (live != null) {
      priceHtml = `<div class="p">حي $${live}</div>`;
    } else {
      priceHtml = `<div class="p">آخر ${h.avg_price} ${h.cur}</div>`;
    }
    if (pnl != null) {
      const cls = pnl>=0?'up':'down';
      const arr = pnl>=0?'▲':'▼';
      pnlHtml = `<div class="c ${cls}">${arr} ${Math.abs(pnl).toFixed(1)}%</div>`;
    } else {
      pnlHtml = `<div class="c" style="color:var(--muted)">—</div>`;
    }
    return `<div class="holding">
      <div class="asset-ico" style="background:${col}22;color:${col}">${letter}</div>
      <div class="asset-info">
        <div class="nm">${h.name||h.ticker}</div>
        <div class="cat">${h.ticker} · ${h.qty.toFixed(4)} سهم · ${h.cat}</div>
      </div>
      <div class="asset-num">
        <div class="v">€${(h.value_eur||0).toFixed(0)}</div>
        ${pnlHtml}
        ${priceHtml}
      </div>
    </div>`;
  }).join('');
}
renderHolds('الكل');
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    renderHolds(t.dataset.c);
  });
});

// Dividend calendar
const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fmtDate(d){ const p=d.split('-'); return {day:p[2], mon:months[parseInt(p[1])-1]}; }
document.getElementById('cal').innerHTML = DATA.recent_divs.map(d=>{
  const dt = fmtDate(d.date);
  return `<div class="cal-row">
    <div class="cal-date"><span class="d">${dt.day}</span><span class="m">${dt.mon}</span></div>
    <div class="cal-info"><div class="nm">${d.name} (${d.ticker})</div><div class="sub">توزيع أرباح</div></div>
    <div class="cal-amt">€${d.amount.toFixed(2)}</div>
  </div>`;
}).join('');
